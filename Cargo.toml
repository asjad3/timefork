[package]
name = "timefork"
version = "0.1.0"
edition = "2021"
description = "Copy-on-write time machine for coding agent workspaces: checkpoint every tool call, rewind, diff, and fork for free."
license = "MIT"
repository = "https://github.com/asjad3/timefork"
keywords = ["agents", "claude-code", "checkpoint", "copy-on-write", "snapshot"]
categories = ["command-line-utilities", "development-tools", "filesystem"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"

[profile.release]
lto = true
strip = true
